```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<meta name="theme-color" content="#050914">

<title>SKY DODGE MOBILE</title>

<style>
:root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    min-height: 100dvh;
    overflow: hidden;
    background: #050914;
    font-family: Arial, sans-serif;
    touch-action: none;
    overscroll-behavior: none;
}

body {
    position: fixed;
    inset: 0;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    display: block;
    touch-action: none;
}

/* =========================
   HUD
========================= */

#hud {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding:
        calc(10px + var(--safe-top))
        calc(12px + var(--safe-right))
        10px
        calc(12px + var(--safe-left));

    z-index: 5;
    pointer-events: none;
    text-shadow: 0 2px 8px #000;
}

#gameName {
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 3px;
    opacity: .8;
}

#score {
    font-size: 30px;
    line-height: 1;
    font-weight: 1000;
    margin-top: 5px;
}

#record {
    font-size: 13px;
    color: #ffd84d;
    font-weight: 800;
    margin-top: 4px;
}

#level {
    font-size: 13px;
    color: #66ddff;
    font-weight: 800;
    margin-top: 3px;
}

#lives {
    font-size: 18px;
    margin-top: 4px;
    letter-spacing: 2px;
}

/* =========================
   USER
========================= */

#userBox {
    position: fixed;
    top: calc(10px + var(--safe-top));
    right: calc(10px + var(--safe-right));
    z-index: 7;
    pointer-events: auto;
    font-size: 11px;
    text-align: right;
}

#logoutBtn {
    margin-top: 5px;
    padding: 6px 8px;
    font-size: 10px;
    letter-spacing: 0;
}

/* =========================
   CHECKPOINT
========================= */

#checkpoint {
    position: fixed;
    left: 50%;
    top: 23%;

    transform:
        translate(-50%, -50%)
        scale(.78);

    width: 90%;
    text-align: center;

    z-index: 12;
    pointer-events: none;

    opacity: 0;

    font-size: clamp(24px, 8vw, 38px);
    font-weight: 1000;
    letter-spacing: 4px;

    text-shadow:
        3px 0 #00eaff,
        -3px 0 #ff00cc,
        0 0 28px #fff;

    transition: .22s;
}

#checkpoint.show {
    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1);
}

/* =========================
   JOYSTICK
========================= */

#joystick {
    position: fixed;

    left: 50%;
    bottom:
        calc(24px + var(--safe-bottom));

    transform: translateX(-50%);

    width: 168px;
    height: 168px;

    border-radius: 50%;

    z-index: 20;

    border:
        2px solid rgba(100, 220, 255, .34);

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.12),
            rgba(40,170,255,.05) 58%,
            rgba(0,0,0,.20)
        );

    box-shadow:
        0 0 32px rgba(0, 200, 255, .14),
        inset 0 0 35px rgba(0, 200, 255, .10);

    touch-action: none;
}

#joystick::before {
    content: "";

    position: absolute;
    left: 50%;
    top: 50%;

    width: 10px;
    height: 10px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        rgba(255,255,255,.28);
}

#stick {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 74px;
    height: 74px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    border:
        2px solid rgba(255,255,255,.72);

    background:
        radial-gradient(
            circle at 35% 30%,
            #a4f7ff,
            #21a9df 45%,
            #075d96
        );

    box-shadow:
        0 0 24px rgba(0, 210, 255, .70),
        inset 0 0 18px rgba(255,255,255,.25);

    touch-action: none;
    will-change: transform;
}

#joystickText {
    position: absolute;
    left: 0;
    bottom: -22px;
    width: 100%;

    text-align: center;

    color: rgba(255,255,255,.45);
    font-size: 9px;
    letter-spacing: 2px;
}

/* =========================
   SCREENS
========================= */

.screen {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100dvh;

    z-index: 50;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding:
        calc(18px + var(--safe-top))
        calc(18px + var(--safe-right))
        calc(18px + var(--safe-bottom))
        calc(18px + var(--safe-left));

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            #10233d 0%,
            #050914 62%,
            #02040a 100%
        );
}

.screen h1 {
    margin: 0;

    font-size:
        clamp(44px, 15vw, 92px);

    font-weight: 1000;

    line-height: .92;

    letter-spacing: 6px;

    text-shadow:
        4px 0 #00eaff,
        -4px 0 #ff008c,
        0 0 40px #00aaff;
}

.screen p {
    width: min(92vw, 520px);

    margin: 14px 0;

    color: #9eb1c7;

    font-size: 14px;
    line-height: 1.55;
}

.panel {
    width: min(92vw, 390px);

    padding: 20px;

    border:
        1px solid #22516d;

    background:
        rgba(7, 16, 28, .88);

    border-radius: 16px;

    backdrop-filter: blur(8px);
}

input {
    width: 100%;
    height: 48px;

    margin: 6px 0;

    padding: 0 14px;

    border-radius: 10px;

    border:
        1px solid #2b516f;

    background: #081321;

    color: white;

    outline: none;

    font-size: 16px;
    touch-action: manipulation;
}

button {
    min-height: 46px;

    border: 0;
    border-radius: 10px;

    padding:
        12px 18px;

    background:
        linear-gradient(
            135deg,
            #00bfff,
            #0066ff
        );

    color: white;

    font-weight: 900;

    font-size: 14px;

    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 0 24px
        rgba(0, 102, 255, .30);

    touch-action: manipulation;
}

button:active {
    transform: scale(.97);
}

.row {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
}

.row button {
    flex: 1 1 140px;
}

.hidden {
    display: none !important;
}

.small {
    color: #7f98ad;
    font-size: 12px;
}

.gold {
    color: #ffd84d;
    font-weight: 800;
}

.danger {
    color: #ff668a !important;
}

#message {
    min-height: 22px;
    margin-top: 8px;
    font-size: 13px;
    color: #90dfff;
}

#leaderboard {
    width: min(94vw, 600px);
    max-height: 63dvh;
    overflow: auto;
    margin-top: 12px;
    -webkit-overflow-scrolling: touch;
}

.table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

.table th,
.table td {
    padding: 9px 6px;
    border-bottom: 1px solid #163248;
}

.table th {
    color: #66ddff;
    text-align: left;
}

/* =========================
   LANDSCAPE
========================= */

@media (orientation: landscape) and (max-height: 520px) {

    #joystick {
        width: 125px;
        height: 125px;
        bottom: 12px;
    }

    #stick {
        width: 56px;
        height: 56px;
    }

    #joystickText {
        display: none;
    }

    #hud {
        padding-top: 7px;
    }
}

/* =========================
   SMALL PHONES
========================= */

@media (max-height: 680px) and (orientation: portrait) {

    #joystick {
        width: 148px;
        height: 148px;
        bottom:
            calc(15px + var(--safe-bottom));
    }

    #stick {
        width: 66px;
        height: 66px;
    }

    .
