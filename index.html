<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SKY DODGE</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050914;
    font-family: Arial, sans-serif;
}

body {
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: linear-gradient(#07152c, #020611);
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;
    z-index: 10;

    display: flex;
    justify-content: space-between;
    align-items: center;

    color: white;
    font-size: 16px;
    font-weight: bold;

    pointer-events: none;
}

.hudBox {
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 8px 12px;
    backdrop-filter: blur(5px);
}

#gameOver {
    position: fixed;
    inset: 0;
    z-index: 20;

    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;

    background: rgba(0, 0, 0, 0.75);
    color: white;
    text-align: center;
}

#gameOver h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

#gameOver p {
    font-size: 20px;
    margin-bottom: 20px;
}

#restart {
    border: none;
    background: #2196f3;
    color: white;
    font-size: 18px;
    font-weight: bold;
    padding: 14px 25px;
    border-radius: 12px;
    cursor: pointer;
}

#restart:active {
    transform: scale(0.95);
}

#joystick {
    position: fixed;
    left: 25px;
    bottom: 25px;

    width: 130px;
    height: 130px;

    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.2);

    z-index: 15;
}

#stick {
    position: absolute;

    width: 55px;
    height: 55px;

    left: 50%;
    top: 50%;

    margin-left: -27.5px;
    margin-top: -27.5px;

    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    border: 2px solid rgba(255,255,255,0.5);
}

@media (min-width: 800px) {
    #joystick {
        opacity: 0.35;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div class="hudBox">
        Счёт: <span id="score">0</span>
    </div>

    <div class="hudBox">
        Рекорд: <span id="best">0</span>
    </div>

    <div class="hudBox">
        Уровень: <span id="level">1</span>
    </div>

    <div class="hudBox">
        ❤️ <span id="lives">3</span>
    </div>
</div>

<div id="gameOver">
    <h1>ИГРА ОКОНЧЕНА</h1>

    <p>
        Счёт: <span id="finalScore">0</span>
    </p>

    <p>
        Уровень: <span id="finalLevel">1</span>
    </p>

    <button id="restart">
        Играть снова
    </button>
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");
const levelText = document.getElementById("level");
const livesText = document.getElementById("lives");

const gameOverScreen = document.getElementById("gameOver");
const finalScoreText = document.getElementById("finalScore");
const finalLevelText = document.getElementById("finalLevel");
const restartButton = document.getElementById("restart");

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let width = window.innerWidth;
let height = window.innerHeight;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * devicePixelRatio;
    canvas.height = height * devicePixelRatio;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );
}

window.addEventListener("resize", resize);
resize();


// ===============================
// ИГРОК
// ===============================

const player = {
    x: width / 2,
    y: height - 120,

    width: 38,
    height: 55,

    speed: 6,

    dx: 0,
    dy: 0
};


// ===============================
// ИГРА
// ===============================

let score = 0;
let level = 1;
let lives = 3;

let gameRunning = true;

let enemies = [];
let particles = [];

let lastTime = performance.now();
let spawnTimer = 0;


// ===============================
// РЕКОРД
// ===============================

let bestScore =
    Number(localStorage.getItem("skyDodgeBestScore")) || 0;

bestText.textContent = bestScore;


// ===============================
// УПРАВЛЕНИЕ
// ===============================

const keys = {};

window.addEventListener("keydown", (event) => {
    keys[event.key.toLowerCase()] = true;

    if (
        event.key === "ArrowUp" ||
        event.key === "ArrowDown" ||
        event.key === "ArrowLeft" ||
        event.key === "ArrowRight"
    ) {
        event.preventDefault();
    }
});

window.addEventListener("keyup", (event) => {
    keys[event.key.toLowerCase()] = false;
});


// ===============================
// ДЖОЙСТИК
// ===============================

let joystickActive = false;

let joystickX = 0;
let joystickY = 0;

function updateJoystick(clientX, clientY) {
    const rect = joystick.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    let dx = clientX - centerX;
    let dy = clientY - centerY;

    const maxDistance = rect.width / 2 - 30;

    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance > maxDistance) {
        dx = dx / distance * maxDistance;
        dy = dy / distance * maxDistance;
    }

    joystickX = dx / maxDistance;
    joystickY = dy / maxDistance;

    stick.style.transform =
        `translate(${dx}px, ${dy}px)`;
}

function resetJoystick() {
    joystickActive = false;

    joystickX = 0;
    joystickY = 0;

    stick.style.transform = "translate(0, 0)";
}

joystick.addEventListener("pointerdown", (event) => {
    joystickActive = true;
    joystick.setPointerCapture(event.pointerId);

    updateJoystick(event.clientX, event.clientY);
});

joystick.addEventListener("pointermove", (event) => {
    if (!joystickActive) return;

    updateJoystick(event.clientX, event.clientY);
});

joystick.addEventListener("pointerup", resetJoystick);
joystick.addEventListener("pointercancel", resetJoystick);


// ===============================
// СОЗДАНИЕ ВРАГОВ
// ===============================

function createEnemy() {

    /*
       ГЛАВНАЯ ЛОГИКА:

       Уровень 1 = 2 самолётика
       Уровень 2 = 3 самолётика
       Уровень 3 = 4 самолётика
       Уровень 4 = 5 самолётиков

       Каждый уровень +1 враг.
    */

    const enemyCount = level + 1;

    // Не создаём больше врагов,
    // чем разрешено текущим уровнем.
    if (enemies.length >= enemyCount) {
        return;
    }

    const enemy = {

        x: Math.random() * (width - 50) + 25,

        y: -70,

        width: 38,
        height: 55,

        speed:
            2.2 +
            Math.random() * 1.8 +
            level * 0.12,

        rotation:
            (Math.random() - 0.5) * 0.3
    };

    enemies.push(enemy);
}


// ===============================
// САМОЛЁТ ИГРОКА
// ===============================

function drawPlayer() {

    ctx.save();

    ctx.translate(player.x, player.y);

    ctx.fillStyle = "#42a5f5";

    // корпус
    ctx.beginPath();

    ctx.moveTo(0, -28);
    ctx.lineTo(11, 12);
    ctx.lineTo(7, 28);
    ctx.lineTo(0, 22);
    ctx.lineTo(-7, 28);
    ctx.lineTo(-11, 12);

    ctx.closePath();

    ctx.fill();


    // левое крыло
    ctx.fillStyle = "#1976d2";

    ctx.beginPath();

    ctx.moveTo(-7, -2);
    ctx.lineTo(-27, 17);
    ctx.lineTo(-10, 13);

    ctx.closePath();

    ctx.fill();


    // правое крыло
    ctx.beginPath();

    ctx.moveTo(7, -2);
    ctx.lineTo(27, 17);
    ctx.lineTo(10, 13);

    ctx.closePath();

    ctx.fill();


    // кабина
    ctx.fillStyle = "#e3f2fd";

    ctx.beginPath();

    ctx.ellipse(
        0,
        -11,
        4,
        8,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();
}


// ===============================
// ВРАГ
// ===============================

function drawEnemy(enemy) {

    ctx.save();

    ctx.translate(enemy.x, enemy.y);

    ctx.rotate(enemy.rotation);

    ctx.fillStyle = "#ef5350";

    // корпус
    ctx.beginPath();

    ctx.moveTo(0, -28);
    ctx.lineTo(10, 12);
    ctx.lineTo(7, 28);
    ctx.lineTo(0, 22);
    ctx.lineTo(-7, 28);
    ctx.lineTo(-10, 12);

    ctx.closePath();

    ctx.fill();


    // крылья
    ctx.fillStyle = "#c62828";

    ctx.beginPath();

    ctx.moveTo(-7, -2);
    ctx.lineTo(-26, 17);
    ctx.lineTo(-9, 13);

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(7, -2);
    ctx.lineTo(26, 17);
    ctx.lineTo(9, 13);

    ctx.closePath();

    ctx.fill();


    // кабина
    ctx.fillStyle = "#ffcdd2";

    ctx.beginPath();

    ctx.ellipse(
        0,
        -11,
        4,
        8,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
}


// ===============================
// ЧАСТИЦЫ
// ===============================

function createExplosion(x, y) {

    for (let i = 0; i < 15; i++) {

        particles.push({
            x: x,
            y: y,

            dx: (Math.random() - 0.5) * 5,
            dy: (Math.random() - 0.5) * 5,

            life: 1
        });
    }
}

function updateParticles() {

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.dx;
        p.y += p.dy;

        p.life -= 0.03;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

function drawParticles() {

    for (const p of particles) {

        ctx.globalAlpha = p.life;

        ctx.fillStyle = "#ffcc00";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}


// ===============================
// ФОН
// ===============================

const stars = [];

for (let i = 0; i < 100; i++) {

    stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 1.5 + 0.5
    });
}

function drawBackground(delta) {

    ctx.fillStyle = "#020611";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    for (const star of stars) {

        star.y += star.speed * delta * 0.05;

        if (star.y > height) {
            star.y = -5;
            star.x = Math.random() * width;
        }

        ctx.fillStyle = "rgba(255,255,255,0.7)";

        ctx.fillRect(
            star.x,
            star.y,
            star.size,
            star.size
        );
    }
}


// ===============================
// СТОЛКНОВЕНИЯ
// ===============================

function checkCollision(a, b) {

    return (
        a.x - a.width / 2 <
        b.x + b.width / 2 &&

        a.x + a.width / 2 >
        b.x - b.width / 2 &&

        a.y - a.height / 2 <
        b.y + b.height / 2 &&

        a.y + a.height / 2 >
        b.y - b.height / 2
    );
}


// ===============================
// ОБНОВЛЕНИЕ ИГРОКА
// ===============================

function updatePlayer() {

    let dx = 0;
    let dy = 0;

    if (
        keys["arrowleft"] ||
        keys["a"]
    ) {
        dx -= 1;
    }

    if (
        keys["arrowright"] ||
        keys["d"]
    ) {
        dx += 1;
    }

    if (
        keys["arrowup"] ||
        keys["w"]
    ) {
        dy -= 1;
    }

    if (
        keys["arrowdown"] ||
        keys["s"]
    ) {
        dy += 1;
    }

    if (joystickActive) {
        dx = joystickX;
        dy = joystickY;
    }

    player.x += dx * player.speed;
    player.y += dy * player.speed;


    // границы

    if (player.x < 25) {
        player.x = 25;
    }

    if (player.x > width - 25) {
        player.x = width - 25;
    }

    if (player.y < 40) {
        player.y = 40;
    }

    if (player.y > height - 40) {
        player.y = height - 40;
    }
}


// ===============================
// ОБНОВЛЕНИЕ ВРАГОВ
// ===============================

function updateEnemies(delta) {

    for (let i = enemies.length - 1; i >= 0; i--) {

        const enemy = enemies[i];

        enemy.y += enemy.speed * delta * 0.06;

        // столкновение

        if (checkCollision(player, enemy)) {

            createExplosion(
                enemy.x,
                enemy.y
            );

            enemies.splice(i, 1);

            lives--;

            livesText.textContent = lives;

            if (lives <= 0) {
                endGame();
            }

            continue;
        }


        // самолётик улетел вниз

        if (enemy.y > height + 80) {

            enemies.splice(i, 1);

            score += 10;

            updateLevel();

            scoreText.textContent = score;
        }
    }
}


// ===============================
// УРОВНИ
// ===============================

function updateLevel() {

    const newLevel =
        Math.floor(score / 50) + 1;

    if (newLevel !== level) {

        level = newLevel;

        levelText.textContent = level;

        /*
          Здесь автоматически увеличивается
          количество самолётиков:

          level 1 → 2
          level 2 → 3
          level 3 → 4
          level 4 → 5
          ...
        */
    }
}


// ===============================
// СПАВН
// ===============================

function spawnEnemies(delta) {

    spawnTimer += delta;

    /*
       Чем выше уровень,
       тем быстрее появляются самолётики.
    */

    const spawnDelay =
        Math.max(
            350,
            1400 - level * 40
        );

    if (spawnTimer >= spawnDelay) {

        spawnTimer = 0;

        /*
           Проверяем количество врагов.
           На каждом новом уровне разрешается
           на 1 самолётик больше.
        */

        const maxEnemies = level + 1;

        if (enemies.length < maxEnemies) {

            createEnemy();
        }
    }
}


// ===============================
// GAME OVER
// ===============================

function endGame() {

    gameRunning = false;

    finalScoreText.textContent = score;
    finalLevelText.textContent = level;

    if (score > bestScore) {

        bestScore = score;

        localStorage.setItem(
            "skyDodgeBestScore",
            bestScore
        );
    }

    bestText.textContent = bestScore;

    gameOverScreen.style.display = "flex";
}


// ===============================
// ПЕРЕЗАПУСК
// ===============================

function restartGame() {

    score = 0;
    level = 1;
    lives = 3;

    enemies = [];
    particles = [];

    player.x = width / 2;
    player.y = height - 120;

    spawnTimer = 0;

    scoreText.textContent = score;
    levelText.textContent = level;
    livesText.textContent = lives;

    gameOverScreen.style.display = "none";

    gameRunning = true;

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);
}

restartButton.addEventListener(
    "click",
    restartGame
);


// ===============================
// ТАЙМЕР СЧЁТА
// ===============================

let scoreTimer = 0;


// ===============================
// ГЛАВНЫЙ ЦИКЛ
// ===============================

function gameLoop(time) {

    if (!gameRunning) {
        return;
    }

    const delta =
        Math.min(
            time - lastTime,
            50
        );

    lastTime = time;


    // фон

    drawBackground(delta);


    // игрок

    updatePlayer();


    // враги

    spawnEnemies(delta);

    updateEnemies(delta);


    // частицы

    updateParticles();


    // счёт за время

    scoreTimer += delta;

    if (scoreTimer >= 1000) {

        scoreTimer -= 1000;

        score += 5;

        updateLevel();

        scoreText.textContent = score;
    }


    // рисуем врагов

    for (const enemy of enemies) {
        drawEnemy(enemy);
    }


    // рисуем игрока

    drawPlayer();


    // частицы

    drawParticles();


    requestAnimationFrame(gameLoop);
}


// ===============================
// ЗАПУСК
// ===============================

scoreText.textContent = score;
levelText.textContent = level;
livesText.textContent = lives;

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
